name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts must match wrangler.jsonc (run `npm run cf-typegen` to fix).
      - run: npm run cf-typegen:check

      # src/styles/tokens.css must match design/tokens (run `npm run tokens` to fix).
      - run: npm run tokens:check

      - run: npm run check

      - run: npm test

      - run: npm run build

      # Dev site B (the Galéria direction) is the same code built for env.galeria.
      - run: npm run build
        env:
          CLOUDFLARE_ENV: galeria
