# Deploys to Cloudflare Workers from GitHub Actions.
#
# Recommended alternative: Cloudflare dashboard -> Workers & Pages -> stiletdekor -> Settings ->
# Builds ("Workers Builds" Git integration). It builds every push, gives each branch a preview URL,
# comments on pull requests and needs no API token in GitHub. If you switch to it, delete this file
# so the two do not deploy twice.
#
# This workflow does nothing (and stays green) until both repository secrets exist:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" + D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID
# Before the first run, fill in the D1 database IDs in wrangler.jsonc and deploy the dev Worker
# once by hand (`npm run deploy`): `wrangler versions upload` needs an existing Worker.
#
# Branches other than main -> new version of the "stiletdekor" (dev) Worker with a preview URL,
#                             not promoted to live traffic.
# main                      -> production Worker (`env.production` in wrangler.jsonc).
#
# With @cloudflare/vite-plugin the Cloudflare environment is fixed at BUILD time via CLOUDFLARE_ENV;
# a plain build followed by `wrangler deploy --env production` would ship the dev config.

name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Skip (Cloudflare secrets not configured)
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployments."

      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci

      - name: Test
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm test

      # ---- preview (every branch except main) ----
      - name: Build (preview)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref != 'refs/heads/main'
        run: npm run build

      - name: Upload preview version
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        env:
          # Stable per-branch alias URL: <branch>-stiletdekor.<subdomain>.workers.dev
          WRANGLER_CI_GENERATE_PREVIEW_ALIAS: 'true'
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: |
            d1 migrations apply DB --remote
            versions upload --message "${{ github.sha }}"

      - name: Preview URL
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref != 'refs/heads/main'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          echo "Preview: ${PREVIEW_URL:-see the wrangler output above}" >> "$GITHUB_STEP_SUMMARY"

      # ---- production (main) ----
      - name: Build (production)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ENV: production
        run: npm run build

      - name: Deploy production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: |
            d1 migrations apply DB --remote --env production
            deploy --env production
